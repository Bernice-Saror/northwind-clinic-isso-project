<text x="90" y="118">Patients</text><text x="90" y="218">Email service</text><text x="590" y="84">Lab</text><text x="590" y="160">Ambulance</text><text x="590" y="236">Payments</text>
</g>
<g text-anchor="middle" fill="#5F5E5A" font-size="12">
<text x="90" y="138">Own devices</text><text x="90" y="238">Reminders</text><text x="590" y="104">Test results</text><text x="590" y="180">Dispatch service</text><text x="590" y="256">Card processor</text>
</g>
