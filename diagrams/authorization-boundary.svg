<svg xmlns="http://www.w3.org/2000/svg" width="680" height="362" viewBox="0 0 680 362" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Northwind patient portal authorization boundary</title>
<desc>Dashed boundary encloses the portal app, patient data, logs and backups, staff laptops, and IT admin. Patients, email service, lab, ambulance dispatch, and payment processor sit outside the boundary.</desc>
