<rect width="680" height="362" fill="#ffffff"/>
<rect x="180" y="30" width="320" height="275" rx="16" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="340" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Authorization boundary</text>
<text x="340" y="70" text-anchor="middle" font-size="12" fill="#5F5E5A">Everything Northwind must secure</text>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="1">
<rect x="196" y="90" width="288" height="56" rx="8"/><rect x="196" y="162" width="135" height="56" rx="8"/><rect x="349" y="162" width="135" height="56" rx="8"/><rect x="196" y="234" width="135" height="56" rx="8"/><rect x="349" y="234" width="135" height="56" rx="8"/>
</g>
<g text-anchor="middle" fill="#04342C" font-size="14" font-weight="bold">
<text x="340" y="112">Portal web app</text><text x="263" y="184">Patient data</text><text x="416" y="184">Logs, backups</text><text x="263" y="256">Staff laptops</text><text x="416" y="256">IT admin</text>
</g>
<g text-anchor="middle" fill="#0F6E56" font-size="12">
<text x="340" y="130">Cloud-hosted (Google Cloud)</text><text x="263" y="204">Records, chats</text><text x="416" y="204">Audit trail</text><text x="263" y="276">25 staff users</text><text x="416" y="276">Break-glass</text>
</g>
<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1">
<rect x="20" y="96" width="140" height="56" rx="8"/><rect x="20" y="196" width="140" height="56" rx="8"/><rect x="520" y="62" width="140" height="56" rx="8"/><rect x="520" y="138" width="140" height="56" rx="8"/><rect x="520" y="214" width="140" height="56" rx="8"/>
